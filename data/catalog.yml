# StarLearn 课程目录
# 12 个方向、150 个主题。local 为本地原创教程，url 为官方文档入口。
# 所有图标来自 Simple Icons（CC0 1.0）与 Lucide（ISC）。
catalog:
- group: Python / 数据科学
  icon: static/img/icons/si-python.svg
  items:
  - name: Python3 教程
    desc: 从语法、函数、面向对象到文件与虚拟环境，建立 Python 编程基础。
    local: python/index.html
    icon: static/img/icons/si-python.svg
  - name: Python 2.x 教程
    desc: Python 2.x 语法与迁移注意事项，维护旧项目时快速对照。
    url: https://docs.python.org/2/tutorial/
    icon: static/img/icons/si-python.svg
  - name: FastAPI
    desc: 基于类型注解的现代 Python API 框架，自动生成 OpenAPI 文档。
    url: https://fastapi.tiangolo.com/tutorial/
    icon: static/img/icons/si-fastapi.svg
  - name: Flask
    desc: 轻量灵活的 Python Web 框架，适合从原型到中小型服务。
    url: https://flask.palletsprojects.com/en/stable/tutorial/
    icon: static/img/icons/si-flask.svg
  - name: Django
    desc: 自带 ORM、后台与认证的全栈 Web 框架，适合业务系统。
    url: https://docs.djangoproject.com/en/stable/intro/tutorial01/
    icon: static/img/icons/si-django.svg
  - name: NumPy
    desc: 多维数组、广播与向量化计算，Python 数据科学的基础。
    url: https://numpy.org/doc/stable/user/absolute_beginners.html
    icon: static/img/icons/si-numpy.svg
  - name: Pandas
    desc: DataFrame 数据清洗、分组、合并与时间序列分析。
    url: https://pandas.pydata.org/docs/user_guide/10min.html
    icon: static/img/icons/si-pandas.svg
  - name: SciPy
    desc: 科学计算、优化、积分、信号处理与稀疏矩阵工具集。
    url: https://docs.scipy.org/doc/scipy/tutorial/index.html
    icon: static/img/icons/si-scipy.svg
  - name: Matplotlib
    desc: 用 Python 绘制折线图、柱状图、散点图与出版级图表。
    url: https://matplotlib.org/stable/users/explain/quick_start.html
    icon: static/img/icons/lu-chart-line.svg
  - name: Dash
    desc: 用 Python 构建交互式数据看板与 Web 分析应用。
    url: https://dash.plotly.com/tutorial
    icon: static/img/icons/si-plotly.svg
  - name: Jupyter Notebook
    desc: 交互式 Notebook 环境，边写代码边记录实验过程。
    url: https://docs.jupyter.org/en/latest/
    icon: static/img/icons/si-jupyter.svg
  - name: Pillow
    desc: Python 图像读取、裁剪、缩放、滤镜与批量处理。
    url: https://pillow.readthedocs.io/en/stable/handbook/tutorial.html
    icon: static/img/icons/lu-image.svg
  - name: 量化交易
    desc: 从行情数据、策略回测到风险控制，用 Python 建立量化研究流程。
    local: python/quant.html
    icon: static/img/icons/lu-chart-line.svg
