# StarLearn — Nginx 静态站点 + AI 代理
# 使用前替换 learn.example.com 与证书路径。
# 将本文件放到 /etc/nginx/sites-available/techlearn 并创建软链接。

upstream techlearn_ai {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.example.com;

    # Certbot HTTP-01 验证目录（使用 certbot --nginx 时可省略）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learn.example.com;

    # 首次部署可先用 HTTP 配置，签发证书后再启用本段。
    ssl_certificate     /etc/letsencrypt/live/learn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/techlearn/current/dist;
    index index.html;

    access_log /var/log/nginx/techlearn.access.log;
    error_log  /var/log/nginx/techlearn.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 静态资源长缓存；index.html 不缓存
    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML 不缓存，发布新版本后立即生效
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    # AI 代理（同源，密钥只在服务端）
    location /api/ {
        proxy_pass http://techlearn_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
