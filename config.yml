paths:
  - title: 全栈开发路线
    desc: 从 C# 后端到前端交互，再部署到自己的 Linux 服务器。
    duration: 12–16 周
    icon: "⌘"
    color: "#1d4ed8"
    steps:
      - csharp/intro.html
      - csharp/oop.html
      - frontend/html.html
      - frontend/css.html
      - frontend/javascript.html
      - csharp/aspnet.html
      - server/setup.html
      - server/nginx.html
  - title: AI 工程路线
    desc: 从理解大模型到本地运行、量化、RAG 与服务化。
    duration: 8–12 周
    icon: "✦"
    color: "#1d4ed8"
    steps:
      - python/intro.html
      - ai/intro.html
      - ai/llama-cpp.html
      - ai/quantization.html
      - ai/deepseek-harness.html
      - ai/rag.html
      - server/docker.html
      - projects/local-ai-chat.html
  - title: 运维与部署路线
    desc: 掌握 Linux、SSH、Nginx、Docker 与自动化发布。
    duration: 6–10 周
    icon: "▣"
    color: "#1d4ed8"
    steps:
      - linux/intro.html
      - linux/commands.html
      - linux/permissions.html
      - ssh/basics.html
      - server/setup.html
      - server/nginx.html
      - server/https.html
      - server/cicd.html
  - title: 数据与 AI 应用路线
    desc: 从 Python 数据处理到 Web 服务、Agent 与本地模型部署。
    duration: 8–12 周
    icon: "◈"
    color: "#1d4ed8"
    steps:
      - python/intro.html
      - python/curriculum.html
      - ai/intro.html
      - ai/curriculum.html
      - ai/rag.html
      - server/docker.html
  - title: 后端、数据库与上线路线
    desc: 建立后端接口、数据库建模和 Linux 上线能力。
    duration: 10–14 周
    icon: "⌁"
    color: "#1d4ed8"
    steps:
      - backend/overview.html
      - database/overview.html
      - java/springboot.html
      - server/docker.html
      - server/nginx.html
      - server/https.html
  - title: 零基础编程路线
    desc: 从变量到函数，用四种语言对照打牢编程基本功。
    duration: 4–6 周
    icon: "⌘"
    color: "#1d4ed8"
    steps:
      - foundations/variables.html
      - foundations/arrays.html
      - foundations/conditions.html
      - foundations/loops.html
      - foundations/operators.html
      - foundations/functions.html
      - foundations/practice.html
